<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Karanlık-fantezi 3D Gliński altıgen satranç ve amfi savaş oyunu.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wizard Hex Chess 3D">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Wizard Hex Chess 3D</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #03050B;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #native-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0D162B 0%, #03050B 68%);
      z-index: 9999;
      transition: opacity 0.45s ease;
    }

    #native-splash img {
      width: min(320px, 68vw);
      height: auto;
      filter: drop-shadow(0 0 28px rgba(72, 180, 255, 0.35));
    }
  </style>
  <script src="https://cdn.jsdelivr.net/gh/Knightro63/flutter_angle/assets/gles_bindings.js"></script>
  <script src="battle_audio_web.js"></script>
</head>

<body>
  <div id="native-splash">
    <img src="icons/Icon-512.png" alt="Wizard Hex Chess 3D" />
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('native-splash');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 480);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
